<!doctype html>
<html lang="en">
  <head>
    <!-- Design philosophy reminder: Neo-Broadcast Brutalism for The Flush Report.
      The document shell loads compressed broadcast headlines, readable newsroom body copy,
      and mono ticker/report typography to support the site-wide TV-news identity. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta
      name="description"
      content="The Flush Report is a worker-led wastewater media platform focused on consumer accountability, taxpayer waste, infrastructure stress, and water-quality protection."
    />
    <meta property="og:title" content="The Flush Report" />
    <meta
      property="og:description"
      content="You flush it. Operators fight it. Taxpayers fund it. Reporting live from Shitsville, USA."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#003b75" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>The Flush Report</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
